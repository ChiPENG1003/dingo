domain:
  type: UniformFrequencyDomain
  f_min: 20.0
  f_max: 1024.0
  delta_f: 0.25  # Expressions like 1.0/8.0 would require eval and are not supported

waveform_generator:
  approximant: IMRPhenomXP  # IMRPhenomD upgrade: includes precession, better merger morphology
  f_ref: 20.0

# Dataset only samples over intrinsic parameters. Extrinsic parameters are chosen at train time.
intrinsic_prior:
  # BBH mass range: ISCO frequency ~150-880 Hz, falls within 20-1024 Hz band
  mass_1: bilby.core.prior.Constraint(minimum=5.0, maximum=80.0, name='mass_1')
  mass_2: bilby.core.prior.Constraint(minimum=5.0, maximum=80.0, name='mass_2')
  chirp_mass: bilby.gw.prior.UniformInComponentsChirpMass(minimum=5.0, maximum=30.0, name='chirp_mass')
  mass_ratio: bilby.gw.prior.UniformInComponentsMassRatio(minimum=0.125, maximum=1.0, name='mass_ratio')
  phase: default
  chi_1: bilby.gw.prior.AlignedSpin(name='chi_1', a_prior=Uniform(minimum=0, maximum=0.9))
  chi_2: bilby.gw.prior.AlignedSpin(name='chi_2', a_prior=Uniform(minimum=0, maximum=0.9))
  theta_jn: default
  # Reference values for fixed (extrinsic) parameters. These are needed to generate a waveform.
  luminosity_distance: 1000.0  # Mpc, typical BBH distance
  geocent_time: 0.0  # s

# Dataset size
num_samples: 1000

compression: None